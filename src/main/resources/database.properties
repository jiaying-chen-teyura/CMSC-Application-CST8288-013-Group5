# CMSC MySQL connection properties, read by util.DataSource on first
# getConnection() call (unless DataSource.getInstance().init(...) has
# already been called explicitly, e.g. by a future DB-credentials servlet).
#
# CMSC_database.sql creates a database literally named "cmsc" — this is
# NOT the shared course "evontario"/"courses_db" schema, so do not reuse
# those credentials here. Fill in your own local MySQL instance below.
# Never commit real credentials — these are placeholders.

db.host=localhost
db.port=3306
db.name=cmsc
db.user=CHANGE_ME
db.password=CHANGE_ME
